services:
  - type: web
    name: puppet-house
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: DATABASE_URL
        fromDatabase:
          name: puppet-house-db
          property: connectionString
      # Render's private database connection stays inside its private network.
      - key: DATABASE_SSL
        value: disable
      - key: CRON_SECRET
        generateValue: true
      - key: NEXCONN_APP_KEY
        sync: false
      - key: NEXCONN_APP_SECRET
        sync: false
      - key: NEXT_PUBLIC_NEXCONN_APP_KEY
        sync: false
      - key: NEXCONN_API_BASE_URL
        value: https://api.sg-light-api.com
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4.1-mini

databases:
  - name: puppet-house-db
    plan: free
    databaseName: puppet_house
    user: puppet_house
